  world-not-found: "<red>World <white><world></white> is not loaded."
  world-not-void: "<red>World <white><world></white> already exists and is not a void world, so RingOut leaves it alone."
  invalid-number: "<red><value> is not a valid number."
  out-of-range: "<red>Value must be between <min> and <max>."
  cannot-while-running: "<red>You can't do that while a game is running there."
  reload-busy: "<red>Reload only works while nobody is in a game and no arena is being built."
  reloaded: "<green>Configuration and <count> arena(s) reloaded."
  reload-failed: "<red>config.yml has an error, the previous configuration is kept and hub changes are not saved. <count> arena(s) reloaded. Check the console."
