# RingOut - last one standing inside the ring wins.
# Messages use MiniMessage format: https://docs.advntr.dev/minimessage/format.html

# Each arena lives in plugins/RingOut/arenas/<name>.yml and is made with /ro create <name>.
# New arenas start with these settings; after that every arena file can be tuned on its own.
arena-defaults:
  radius: 20
  slices: 8
  # Slice colors, used in order and repeated if there are more slices than colors.
  colors:
    - RED_CONCRETE
    - ORANGE_CONCRETE
    - YELLOW_CONCRETE
    - LIME_CONCRETE
    - CYAN_CONCRETE
    - BLUE_CONCRETE
    - PURPLE_CONCRETE
    - PINK_CONCRETE
  edge: WHITE_CONCRETE
  core: OBSIDIAN
  core-radius: 2

# Players who are not in a game wait at the hub. The whole server is RingOut: everyone is
# sent here with an empty inventory when they join the server or a game ends, except players
# with the ringout.bypass permission, who keep their state on join (for building).
hub:
  # Set with /ro sethub. Until then players are sent to the main world spawn.
  set: false

game:
  min-players: 2
  max-players: 16
  # Start automatically once min-players have joined.
  auto-start: true
  # Seconds the lobby waits for more players after min-players is reached.
  lobby-wait: 15
  # Seconds players stand frozen on their slice before the fight starts.
  countdown: 5
  # Seconds between random items.
  item-interval: 8
  # Extra distance (blocks) past the ring edge before a player counts as outside.
  margin: 0.5
  # Ticks a player may stay outside the ring (e.g. on a bridge) before elimination. 20 ticks = 1 second.
  outside-grace-ticks: 20
  # Players this many blocks below the ring are eliminated.
  fall-depth: 5
  # false = hits deal no damage but still knock back.
  pvp-damage: true
  # Whether TNT and other explosions can blow holes in the ring. The ring is rebuilt every game.
  explosions-break-arena: true
  # Placed TNT ignites immediately.
  auto-prime-tnt: true
  tnt-fuse-ticks: 40
  # Spectators further than this from the center are pulled back. 0 = radius + 30.
  spectator-max-distance: 0
  # Seconds to celebrate before everyone is sent back.
  ending-seconds: 8
  # Blocks placed per tick while building a ring. Lower it if building causes lag.
  blocks-per-tick: 2000

sudden-death:
  enabled: true
  # Seconds into the fight before the ring starts shrinking.
  start-after: 300
  # Seconds between each ring removal.
  shrink-interval: 5
  min-radius: 3

# Console commands run for the winner. %player% is replaced with the winner's name.
win-commands: []
#  - "give %player% diamond 1"

# Random item pool. Each entry: material, amount, weight (higher = more common),
# optional name, lore, enchantments, unbreakable, and extra (items given together with it).
items:
  - material: STICK
    name: "<gold><bold>Knockback Stick"
    weight: 12
    enchantments:
      knockback: 2
  - material: WHITE_WOOL
    amount: 16
    weight: 14
  - material: OAK_PLANKS
    amount: 16
    weight: 8
  - material: SNOWBALL
    amount: 8
    weight: 10
  - material: EGG
    amount: 8
    weight: 6
  - material: WIND_CHARGE
    amount: 3
    weight: 7
  - material: ENDER_PEARL
    amount: 1
    weight: 5
  - material: FISHING_ROD
    weight: 6
  - material: BOW
    name: "<aqua>Punch Bow"
    weight: 5
    unbreakable: true
    enchantments:
      punch: 1
      infinity: 1
    extra:
      - material: ARROW
        amount: 1
  - material: STONE_SWORD
    weight: 5
    enchantments:
      knockback: 1
  - material: TNT
    amount: 2
    weight: 5
  - material: GOLDEN_APPLE
    amount: 1
    weight: 4
  - material: COBWEB
    amount: 2
    weight: 4
  - material: SLIME_BLOCK
    amount: 4
    weight: 4
  - material: SHIELD
    weight: 3

