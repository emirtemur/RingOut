  arena-busy: "<red><white><arena></white> is being built, try again in a moment."
  arena-not-saved: "<red>arenas/<arena>.yml has an error, so this change is applied but not saved yet. Fix the file: it is saved with the next build, or set it again after <yellow>/ro reload</yellow>."
  center-set: "<green>Center of <white><arena></white> set to <white><world> <x> <y> <z></white>. Run <yellow>/ro build <arena></yellow> to build it."
  lobby-set: "<green>Lobby of <white><arena></white> set."
