  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>Only players can use this command."
  usage: "<gray>Usage: <yellow>/ro <join|leave|list|create|delete|setcenter|setlobby|radius|slices|build|start|stop|sethub|createworld|reload>"
  arena-not-found: "<red>There is no arena called <white><arena></white>. See <yellow>/ro list</yellow>."
  arena-not-ready: "<red>This arena is not built yet. An admin must run <yellow>/ro build <arena></yellow>."
  arena-resetting: "<yellow>The arena is being reset, try again in a moment."
  already-in-game: "<red>You are already in a game."
  not-in-game: "<red>You are not in a game."
  game-running: "<red>A game is already in progress there. Try again when it ends."
  game-full: "<red>The game is full."
  joined: "<green><player> joined the ring! <gray>(<count>/<max>)"
  bypass-inventory-cleared: "<yellow>Your inventory was cleared for the game. The bypass permission only keeps it when you join the server."
  left: "<yellow><player> left the game. <gray>(<count>/<max>)"
  waiting: "<gray>Waiting for players... <yellow><count>/<min>"
  lobby-countdown: "<yellow>The game starts in <gold><seconds></gold>s!"
  lobby-cancelled: "<red>Not enough players, the start was cancelled."
  preparing: "<yellow>Preparing the arena..."
  countdown-title: "<gold><seconds>"
  countdown-subtitle: "<yellow>Get ready!"
  start-title: "<green><bold>FIGHT!"
  start-subtitle: "<gray>Knock everyone out of the ring"
  item-received: "<gray>You received <item><gray>."
  eliminated-fell: "<red><player> fell out of the ring! <gray><alive> left."
  eliminated-outside: "<red><player> stepped out of the ring! <gray><alive> left."
  eliminated-killed: "<red><player> was knocked out! <gray><alive> left."
  eliminated-left: "<red><player> left and was eliminated. <gray><alive> left."
  eliminated-title: "<red><bold>ELIMINATED"
  eliminated-subtitle: "<gray>You are now spectating."
  sudden-death: "<dark_red><bold>SUDDEN DEATH!</bold> <red>The ring is shrinking!"
  bossbar: "<yellow>Players left: <white><alive></white> <dark_gray>•</dark_gray> Next item: <white><seconds>s"
  bossbar-sudden-death: "<red>Players left: <white><alive></white> <dark_gray>•</dark_gray> Ring radius: <white><radius>"
  win-broadcast: "<gold><bold><player></bold> <yellow>is the last one standing and wins!"
  win-title: "<gold><bold><player> WINS!"
  win-subtitle: "<yellow>Last one in the ring"
  no-winner: "<gray>Nobody survived. No winner this time."
  game-stopped: "<red>The game was stopped by an admin."
  no-game: "<red>There is no game to stop in <white><arena></white>."
  start-not-enough: "<red>Need at least <min> player(s) to start."
  started: "<green>Starting the game in <white><arena></white>."
  stopped: "<green>Game in <white><arena></white> stopped."
  arena-list-header: "<gold>Arenas:"
  arena-list-entry: "<dark_gray>- <white><arena></white> <state> <gray><count>/<max> <dark_gray>(<world> <x> <y> <z>, radius <radius>)"
  arena-list-empty: "<gray>No arenas yet. An admin can create one with <yellow>/ro create <name></yellow>."
  state-not-built: "<dark_gray>not built"
  state-waiting: "<green>waiting"
  state-starting: "<yellow>starting soon"
  state-building: "<yellow>resetting"
  state-playing: "<red>in game"
  state-ending: "<red>ending"
  invalid-arena-name: "<red>Arena names may only use a-z, 0-9, _ and - (up to 32 characters)."
  arena-exists: "<red>An arena called <white><arena></white> already exists."
  arena-created: "<green>Arena <white><arena></white> created at <white><world> <x> <y> <z></white>. Run <yellow>/ro build <arena></yellow> to build it."
  arena-create-failed: "<red>Could not save arenas/<arena>.yml, so the arena was not created. Check the console."
  arena-deleted: "<green>Arena <white><arena></white> deleted. Its blocks are still in the world."
