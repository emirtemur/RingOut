name: RingOut
version: '${version}'
main: me.emirtemur.ringout.RingOutPlugin
api-version: '1.21'
authors: [emirtemur]
description: Last one standing inside the ring wins.

commands:
  ringout:
    description: RingOut minigame commands.
    usage: /<command> <join|leave|list|create|delete|setcenter|setlobby|radius|slices|build|start|stop|sethub|createworld|reload>
    aliases: [ro]

permissions:
  ringout.play:
    description: Join and leave RingOut games and list the arenas.
    default: true
  ringout.admin:
    description: Set up and control RingOut arenas.
    default: op
  ringout.bypass:
    description: Keep your inventory and game mode on server join and change the hub (for building). Joining a game still resets you.
    default: op
